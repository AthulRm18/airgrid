services:
  - type: web
    name: airgrid
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite-preview
      - key: GEMINI_TIMEOUT_SECONDS
        value: 30
      - key: OPENAQ_API_KEY
        sync: false
      - key: USE_EARTH_ENGINE
        value: false
      - key: DEMO_AUTO_SEED
        value: true
      - key: FIREBASE_PROJECT_ID
        value: cognitive-late
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
